schema_version = "1.4"
artifacts = ["/home/workspace/croaring/submission/src", "/home/workspace/croaring/submission/include"]
[task]
name = "edgebench-author/croaring-venn3"
version = "0.1.0-constructed"
description = "Fuse bounded three-bitmap Venn histograms in pinned CRoaring"
[metadata]
reward_type = "bounded_continuous"
status = "constructed_unverified"
performance_enabled = false
score_spec = "authoring/score-spec.json"
[agent]
timeout_sec = 21600
user = "65534"
network_mode = "no-network"
[environment]
docker_image = "edgebench-croaring-venn3-agent:draft1"
workdir = "/home/workspace/croaring"
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
build_timeout_sec = 900
[verifier]
timeout_sec = 1200
environment_mode = "separate"
network_mode = "no-network"
user = "0"
[verifier.environment]
docker_image = "edgebench-croaring-venn3-verifier:draft1"
workdir = "/home/workspace/croaring"
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
build_timeout_sec = 900
